name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folders
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name new_note --org com.newnote .
          cp /tmp/pubspec.yaml pubspec.yaml
      - name: Arrange source files
        run: |
          mkdir -p lib
          mv -f *.dart lib/ 2>/dev/null || true
          rm -rf test
      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="New note"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: new-note-apk
          path: build/app/outputs/flutter-apk/app-release.apk
